<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gentse Feesten</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: system-ui, sans-serif;
    margin: 0;
    padding: 1rem;
  }
  h1 { font-size: 1.3rem; margin: 0 0 0.75rem; }
  #day-tabs {
    display: flex;
    gap: 0.4rem;
    overflow-x: auto;
    padding-bottom: 0.5rem;
    margin-bottom: 0.75rem;
    border-bottom: 1px solid #8883;
  }
  .day-tab {
    flex: 0 0 auto;
    font: inherit;
    font-size: 0.85rem;
    color: inherit;
    background: none;
    border: 1px solid #8886;
    border-radius: 999px;
    padding: 0.35rem 0.8rem;
    cursor: pointer;
    white-space: nowrap;
  }
  .day-tab.active {
    background: #4a7;
    border-color: #4a7;
    color: #fff;
    font-weight: 600;
  }
  #status { color: gray; font-size: 0.9rem; }

  #gantt-wrap {
    overflow: auto;
    max-height: calc(100vh - 7rem);
    border: 1px solid #8883;
    position: relative;
  }
  #gantt {
    position: relative;
    display: grid;
    grid-template-columns: 160px max-content;
  }
  .loc-header, .time-header {
    position: sticky;
    top: 0;
    z-index: 3;
    background: Canvas;
    border-bottom: 1px solid #8886;
  }
  .loc-header {
    left: 0;
    z-index: 4;
    will-change: transform;
  }
  .time-header {
    height: 28px;
  }
  .time-mark {
    position: absolute;
    top: 0;
    bottom: 0;
    display: flex;
    align-items: center;
    border-left: 1px solid #8883;
    font-size: 0.7rem;
    color: #666;
    padding-left: 3px;
    white-space: nowrap;
  }
  .time-mark.hour { border-left: 1px solid #8888; font-weight: 600; }
  .loc-cell {
    position: sticky;
    left: 0;
    z-index: 2;
    will-change: transform;
    background: Canvas;
    display: flex;
    align-items: center;
    padding: 0 0.5rem;
    font-size: 0.8rem;
    border-bottom: 1px solid #8883;
    border-right: 1px solid #8886;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .loc-cell a {
    color: inherit;
    text-decoration: none;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .loc-cell a:hover { text-decoration: underline; }
  .row-track {
    position: relative;
    border-bottom: 1px solid #8883;
  }
  .event-block {
    position: absolute;
    top: 2px;
    bottom: 2px;
    background: #4a7;
    color: #fff;
    border-radius: 4px;
    padding: 0 4px;
    font-size: 0.72rem;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    text-decoration: none;
    display: block;
  }
  .event-block:hover { outline: 2px solid #285; z-index: 1; }

  #filters {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.85rem;
    margin-bottom: 0.5rem;
  }
  .switch {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    cursor: pointer;
    user-select: none;
  }
  .switch input {
    position: absolute;
    opacity: 0;
    width: 0;
    height: 0;
  }
  .switch-track {
    flex: 0 0 auto;
    width: 42px;
    height: 24px;
    background: #8886;
    border-radius: 999px;
    position: relative;
    transition: background 0.15s;
  }
  .switch-track::before {
    content: "";
    position: absolute;
    top: 2px;
    left: 2px;
    width: 20px;
    height: 20px;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 1px 2px #0004;
    transition: transform 0.15s;
  }
  .switch input:checked + .switch-track {
    background: #4a7;
  }
  .switch input:checked + .switch-track::before {
    transform: translateX(18px);
  }
  .switch input:focus-visible + .switch-track {
    outline: 2px solid #4a7;
    outline-offset: 2px;
  }
</style>
</head>
<body>
<h1>Gentse Feesten</h1>
<div id="day-tabs"></div>
<div id="filters">
  <label class="switch">
    <input type="checkbox" id="hide-paid">
    <span class="switch-track"></span>
    Paid events (💰)
  </label>
</div>
<div id="status"></div>
<div id="gantt-wrap"><div id="gantt"></div></div>

<script>
const MAX_DATE = "2026-07-26"; // Sunday, last day of the fest
const WEEKDAYS = ["zo", "ma", "di", "wo", "do", "vr", "za"];
const PX_PER_MIN = 2;
const ROW_H = 28;
const DEFAULT_DURATION = 60; // minutes, used when an event has no known end

const CATEGORY_EMOJI = {
  "Bals/Dans": "💃",
  "Boottochten": "🚤",
  "Circus": "🎪",
  "Miramiro": "🎪",
  "Comedy": "😂",
  "Concerten > divers": "🎵",
  "Concerten > jazz": "🎷",
  "Concerten > klassiek": "🎻",
  "Concerten > rock-pop-techno-blues-folk-world music": "🎸",
  "Kinder- en jeugdprogramma's": "🧸",
  "Markten": "🛒",
  "Puppetbuskersfestival": "🎭",
  "Spel, sport en recreatie": "⚽",
  "Tentoonstellingen en geleide bezoeken": "🚶",
  "Theater": "🎭",
  "Varia": "✨",
  "Vertellingen/lezingen/poëzie": "📖",
  "Wandelingen": "🚶",
};

const LOW_PRIORITY_CATEGORIES = ["Kinder- en jeugdprogramma's"];

function categoryEmojis(categories) {
  let fallback = "";
  for (const c of categories || []) {
    const emoji = CATEGORY_EMOJI[c];
    if (!emoji) continue;
    if (!LOW_PRIORITY_CATEGORIES.includes(c)) return emoji;
    if (!fallback) fallback = emoji;
  }
  return fallback;
}

let allDays = {};    // date -> events
let allLocations = {}; // venue name -> gmaps link or null
let hardStartTitles = new Set(); // titles with strict door times
let hardStartGraceMinutes = 10;

async function loadData() {
  const res = await fetch("data.json");
  const data = await res.json();
  allDays = data.days;
  allLocations = data.locations;
  hardStartTitles = new Set(data.hardStart?.events || []);
  hardStartGraceMinutes = data.hardStart?.graceMinutes ?? 10;
}

function toISO(d) {
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}

// Fest day rolls over at 7am, not midnight: 01:00 still counts as "yesterday".
function festDayISO() {
  const now = new Date();
  if (now.getHours() < 7) now.setDate(now.getDate() - 1);
  return toISO(now);
}

// Convert "HH:MM" to minutes-since-midnight, rolled so times before 07:00
// come out after 24:00 (matches the fest-day numbering used elsewhere).
function toFestMinutes(hhmm) {
  const [h, m] = hhmm.split(":").map(Number);
  let mins = h * 60 + m;
  if (mins < 7 * 60) mins += 24 * 60;
  return mins;
}

const dayTabsEl = document.getElementById("day-tabs");
const statusEl = document.getElementById("status");
const ganttEl = document.getElementById("gantt");
const hidePaidEl = document.getElementById("hide-paid");

let currentDay = null;
hidePaidEl.checked = localStorage.getItem("showPaid") !== "0";
hidePaidEl.addEventListener("change", () => {
  localStorage.setItem("showPaid", hidePaidEl.checked ? "1" : "0");
  if (currentDay) loadDay(currentDay);
});

function buildDayTabs() {
  const start = new Date(festDayISO() + "T00:00:00");
  const end = new Date(MAX_DATE + "T00:00:00");
  const dates = [];
  for (let d = start; d <= end; d.setDate(d.getDate() + 1)) {
    dates.push(new Date(d));
  }
  if (dates.length === 0) dates.push(end); // today is past MAX_DATE: still show last day

  for (const d of dates) {
    const iso = toISO(d);
    const btn = document.createElement("button");
    btn.className = "day-tab";
    btn.textContent = `${WEEKDAYS[d.getDay()]} ${d.getDate()} jul`;
    btn.dataset.date = iso;
    btn.addEventListener("click", () => selectDay(iso));
    dayTabsEl.appendChild(btn);
  }
  return toISO(dates[0]);
}

function selectDay(iso, updateUrl = true) {
  for (const btn of dayTabsEl.children) {
    btn.classList.toggle("active", btn.dataset.date === iso);
  }
  loadDay(iso);
  if (updateUrl) {
    const url = new URL(location.href);
    url.searchParams.set("date", iso);
    history.replaceState(null, "", url);
  }
}

const defaultDay = buildDayTabs();
const urlDate = new URLSearchParams(location.search).get("date");
const validDates = [...dayTabsEl.children].map((btn) => btn.dataset.date);
const initialDay = validDates.includes(urlDate) ? urlDate : defaultDay;

// Assign each event a lane within its venue row so overlapping events stack
// instead of collide. Greedy: reuse the first lane whose last event ends
// before this one starts.
function assignLanes(events) {
  const lanes = []; // lanes[i] = end-minutes of last event placed in lane i
  for (const e of events) {
    let lane = lanes.findIndex((endMin) => endMin <= e._start);
    if (lane === -1) {
      lane = lanes.length;
      lanes.push(0);
    }
    lanes[lane] = e._end;
    e._lane = lane;
  }
  return lanes.length;
}

function loadDay(date) {
  currentDay = date;
  ganttEl.innerHTML = "";
  const dayEvents = allDays[date];
  if (!dayEvents) {
    statusEl.textContent = `No data file for ${date} yet (run fetch_day.py ${date}).`;
    return;
  }
  let events = dayEvents
    .filter((e) => e.start)
    .filter((e) => hidePaidEl.checked || e.price == null)
    .map((e) => {
      const start = toFestMinutes(e.start);
      const end = e.end ? toFestMinutes(e.end) : start + DEFAULT_DURATION;
      return { ...e, _start: start, _end: Math.max(end, start + 15) };
    });

  if (date === festDayISO()) {
    const now = new Date();
    const nowMinutes = toFestMinutes(`${now.getHours()}:${now.getMinutes()}`);
    events = events.filter((e) => e._end >= nowMinutes);
    events = events.filter((e) => {
      if (!hardStartTitles.has(e.title)) return true;
      return nowMinutes < e._start + hardStartGraceMinutes;
    });
    // Clip already-passed portion of in-progress events so the timeline
    // (and their bars) starts at the current half-hour, not their real start.
    const nowFloor = Math.floor(nowMinutes / 30) * 30;
    for (const e of events) {
      if (e._start < nowFloor) e._start = nowFloor;
    }
  }

  if (events.length === 0) {
    statusEl.textContent = "No events found for this date.";
    return;
  }
  statusEl.textContent = "";

  // Group by venue, sorted by each venue's earliest event.
  const byVenue = new Map();
  for (const e of events) {
    if (!byVenue.has(e.venue)) byVenue.set(e.venue, []);
    byVenue.get(e.venue).push(e);
  }
  const venues = [...byVenue.keys()].sort((a, b) => {
    const aMin = Math.min(...byVenue.get(a).map((e) => e._start));
    const bMin = Math.min(...byVenue.get(b).map((e) => e._start));
    return aMin - bMin || a.localeCompare(b);
  });

  let minStart = Infinity, maxEnd = -Infinity;
  for (const e of events) {
    if (e._start < minStart) minStart = e._start;
    if (e._end > maxEnd) maxEnd = e._end;
  }
  const minMinutes = Math.floor(minStart / 30) * 30;
  const maxMinutes = Math.ceil(maxEnd / 30) * 30;
  const timelineWidth = (maxMinutes - minMinutes) * PX_PER_MIN;

  // Row lanes per venue (some venues have overlapping events -> multi-row height).
  const laneCounts = new Map();
  for (const v of venues) {
    byVenue.get(v).sort((a, b) => a._start - b._start);
    laneCounts.set(v, assignLanes(byVenue.get(v)));
  }

  ganttEl.style.gridTemplateColumns = `160px ${timelineWidth}px`;

  // Corner + time header
  const corner = document.createElement("div");
  corner.className = "loc-header";
  ganttEl.appendChild(corner);

  const timeHeader = document.createElement("div");
  timeHeader.className = "time-header";
  timeHeader.style.width = timelineWidth + "px";
  for (let m = minMinutes; m <= maxMinutes; m += 30) {
    const mark = document.createElement("div");
    const isHour = m % 60 === 0;
    mark.className = "time-mark" + (isHour ? " hour" : "");
    mark.style.left = (m - minMinutes) * PX_PER_MIN + "px";
    const h = Math.floor(m / 60) % 24;
    const mm = m % 60;
    mark.textContent = `${String(h).padStart(2, "0")}:${String(mm).padStart(2, "0")}`;
    timeHeader.appendChild(mark);
  }
  ganttEl.appendChild(timeHeader);

  // Row-track background: 30-min/hour grid drawn once as a CSS gradient
  // instead of per-row divs (same pattern was being rebuilt for every venue).
  const hourStepPx = 60 * PX_PER_MIN;
  const halfStepPx = 30 * PX_PER_MIN;
  const hourOffsetPx = ((60 - (minMinutes % 60)) % 60) * PX_PER_MIN;
  const gridBackground =
    `repeating-linear-gradient(to right, #8886 0, #8886 1px, transparent 1px, transparent ${hourStepPx}px),` +
    `repeating-linear-gradient(to right, #8882 0, #8882 1px, transparent 1px, transparent ${halfStepPx}px)`;
  const gridBackgroundPosition = `${hourOffsetPx}px 0, 0 0`;

  // Rows
  for (const v of venues) {
    const rowH = ROW_H * laneCounts.get(v);

    const locCell = document.createElement("div");
    locCell.className = "loc-cell";
    locCell.style.height = rowH + "px";
    const link = allLocations[v];
    if (link) {
      const a = document.createElement("a");
      a.href = link;
      a.target = "_blank";
      a.rel = "noopener";
      a.textContent = v;
      a.title = v;
      locCell.appendChild(a);
    } else {
      locCell.textContent = v;
      locCell.title = v;
    }
    ganttEl.appendChild(locCell);

    const track = document.createElement("div");
    track.className = "row-track";
    track.style.height = rowH + "px";
    track.style.width = timelineWidth + "px";
    track.style.backgroundImage = gridBackground;
    track.style.backgroundPosition = gridBackgroundPosition;

    for (const e of byVenue.get(v)) {
      const a = document.createElement("a");
      a.className = "event-block";
      a.href = e.link;
      a.target = "_blank";
      a.rel = "noopener";
      a.style.left = (e._start - minMinutes) * PX_PER_MIN + "px";
      a.style.width = (e._end - e._start) * PX_PER_MIN - 2 + "px";
      a.style.top = e._lane * ROW_H + 2 + "px";
      a.style.height = ROW_H - 4 + "px";
      a.style.lineHeight = (ROW_H - 4) + "px";
      const prefix = categoryEmojis(e.categories) + (e.price != null ? "💰" : "");
      if (prefix) a.appendChild(document.createTextNode(prefix + " "));
      a.appendChild(document.createTextNode(e.title));
      a.title = `${e.title}\n${e.start}${e.end ? "–" + e.end : ""}${e.price ? " · €" + e.price : ""}`;
      track.appendChild(a);
    }

    ganttEl.appendChild(track);
  }
}

loadData().then(() => {
  selectDay(initialDay);
});

window.addEventListener("popstate", () => {
  const iso = new URLSearchParams(location.search).get("date");
  if (validDates.includes(iso)) selectDay(iso, false);
});
</script>
</body>
</html>
